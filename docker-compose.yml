services:
  watcher:
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: "1.61.0"
    image: sv-watcher:1.61.0
    container_name: sv-watcher
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      MODE: notify_only
      AUTO_CONFIRM: "false"
      DATABASE_PATH: /app/data/sv.db
      DISPLAY: ":99"
    volumes:
      - sv-data:/app/data
    shm_size: "2gb"
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["/bin/sh", "-c", "Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &\n sleep 1\n exec python bot.py\n"]

volumes:
  sv-data:
